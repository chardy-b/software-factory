[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "software-factory"
version = "0.1.0"
description = "Local configuration validation and diagnostics for a software factory controller"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.25",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[project.scripts]
software-factory = "software_factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/software_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["software_factory"]
mypy_path = "src"
